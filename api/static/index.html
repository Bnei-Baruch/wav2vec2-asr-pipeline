<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STT Compare</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="/static/css.css" />
</head>
<body>
  <div id="root"></div>
  <script>
    // Load the JSX sources in order, compile them together as ONE program so
    // they share scope (MODELS, Column, Player, App), then run.
    (async () => {
      const files = [
        "/static/utils.js",
        "/static/Column.jsx",
        "/static/Player.jsx",
        "/static/app.jsx",
      ];
      try {
        const sources = await Promise.all(
          files.map(f => fetch(f).then(r => {
            if (!r.ok) throw new Error(`${f}: ${r.status}`);
            return r.text();
          }))
        );
        const { code } = Babel.transform(sources.join("\n;\n"), {
          presets: ["react"],
          filename: "app.jsx",
        });
        const script = document.createElement("script");
        script.textContent = code;
        document.body.appendChild(script);
      } catch (err) {
        console.error("Failed to load app:", err);
        document.getElementById("root").textContent = "Failed to load app: " + err.message;
      }
    })();
  </script>
</body>
</html>
